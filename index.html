<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <script>
    const trackerUrl = "https://tracker-email-tau.vercel.app/api/imagem?t=Site_Email_Redirecionador_Nerve-Fresh";
    const destino = "https://secure.nervefresh.com/index-nf-ds#aff=leofirmo";
    let executado = false;

    function redirecionar() {
      if (!executado) {
        executado = true;
        window.location.replace(destino);
      }
    }

    // 1. Força o disparo via API Fetch com cache desativado
    fetch(trackerUrl, { mode: 'no-cors', cache: 'no-store' })
      .finally(redirecionar);

    // 2. Força o disparo via instância direta de Image na memória
    const img = new Image();
    img.src = trackerUrl + "&_=" + Date.now(); // Bula o cache do navegador
    img.onload = redirecionar;
    img.onerror = redirecionar;

    // 3. Fallback de tempo limite absoluto (200ms)
    setTimeout(redirecionar, 200);
  </script>

</body>
</html>
